<html lang="en">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6C3AED;--primary-light:#8B5CF6;--primary-dark:#5B21B6;--accent:#06D6A0;--accent-dark:#05B587;--bg:#0A0A0F;--bg-card:#13131A;--bg-card-hover:#1A1A25;--text:#F8F8FC;--text-muted:#9CA3AF;--border:rgba(42,42,58,0.8);--gradient-1:linear-gradient(135deg,#6C3AED,#06D6A0)}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.6}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes pulse-ring{0%{transform:scale(0.8);opacity:1}100%{transform:scale(2.5);opacity:0}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes gradient-shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes orbit{from{transform:rotate(0deg) translateX(120px) rotate(0deg)}to{transform:rotate(360deg) translateX(120px) rotate(-360deg)}}
.fade-in{animation:fadeInUp 0.8s ease forwards;opacity:0}.delay-1{animation-delay:0.1s}.delay-2{animation-delay:0.2s}.delay-3{animation-delay:0.3s}.delay-4{animation-delay:0.4s}.delay-5{animation-delay:0.5s}
h1{font-size:clamp(2.5rem,6vw,4.5rem);font-weight:800;line-height:1.1;letter-spacing:-0.03em}
h2{font-size:clamp(2rem,4vw,3rem);font-weight:700;line-height:1.2;letter-spacing:-0.02em}
h3{font-size:1.25rem;font-weight:600}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.section{padding:100px 0;position:relative}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:12px;font-weight:600;font-size:1rem;cursor:pointer;transition:all 0.3s ease;border:none;text-decoration:none;font-family:inherit}
.btn-primary{background:var(--gradient-1);color:white;box-shadow:0 4px 24px rgba(108,58,237,0.4)}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(108,58,237,0.5)}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--primary);background:rgba(108,58,237,0.1)}
.badge{display:inline-flex;padding:8px 20px;border-radius:100px;font-size:0.875rem;font-weight:500;background:rgba(108,58,237,0.1);border:1px solid rgba(108,58,237,0.2);color:var(--primary-light)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:32px;transition:all 0.3s ease}.card:hover{background:var(--bg-card-hover);border-color:rgba(108,58,237,0.3);transform:translateY(-4px)}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,10,15,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}

.hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 30%,rgba(108,58,237,0.15) 0%,transparent 60%),radial-gradient(ellipse at 80% 70%,rgba(6,214,160,0.08) 0%,transparent 40%)}
.orb-wrap{position:relative;width:200px;height:200px;margin:0 auto 48px}

<script type="text/babel">
const convFlows={
greet:[{text:"Hello! I'm Callix, your AI voice assistant. I can help with sales inquiries, product info, pricing, or support. What can I help you with?"}],
pricing:[{text:"Great question! We have 3 plans: Starter at $49/mo with 1,000 minutes, Professional at $149/mo with 5,000 minutes (our most popular), and Enterprise at $299/mo with unlimited minutes. Which interests you?"}],
features:[{text:"Callix offers: AI-powered voice conversations with natural language understanding, 24/7 availability, CRM integrations (Salesforce, HubSpot), real-time analytics dashboards, multi-language support in 40+ languages, and custom voice personas. Want details on any of these?"}],
demo:[{text:"You're already trying our demo! This conversation uses the same AI engine that powers production Callix agents. Try asking about pricing, features, or how we handle specific use cases."}],
support:[{text:"For support, we offer: live chat, email at support@callix.ai, phone support for Pro and Enterprise plans, and a comprehensive knowledge base. Enterprise customers also get a dedicated success manager. How can I help?"}],
general:[{text:"I'd be happy to help! I'm Callix's AI assistant. I can discuss our platform, pricing, features, or help with any questions about AI voice agents. What's on your mind?"}]
};
function getAIResponse(input){
const t=input.toLowerCase();
if(/\b(hi|hello|hey|greetings)\b/.test(t))return convFlows.greet[0].text;
if(/\b(price|pricing|cost|plan|subscription|how much)\b/.test(t))return convFlows.pricing[0].text;
if(/\b(feature|capability|what can|do you offer|integration)\b/.test(t))return convFlows.features[0].text;
if(/\b(demo|try|test|example|show)\b/.test(t))return convFlows.demo[0].text;
if(/\b(support|help|issue|problem|contact)\b/.test(t))return convFlows.support[0].text;
return convFlows.general[0].text;
}

function DemoPage({nav}){
const[messages,setMessages]=React.useState([{role:'ai',text:"Hi! I'm Callix, your AI voice assistant. I can help with sales inquiries, product information, pricing, or technical support. What can I help you with today?"}]);
const[input,setInput]=React.useState('');
const[listening,setListening]=React.useState(false);
const[speaking,setSpeaking]=React.useState(false);
const chatRef=React.useRef(null);
const recognitionRef=React.useRef(null);
React.useEffect(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight},[messages]);
const speak=(text)=>{if('speechSynthesis' in window){setSpeaking(true);const u=new SpeechSynthesisUtterance(text);u.rate=1;u.pitch=1;u.onend=()=>setSpeaking(false);u.onerror=()=>setSpeaking(false);speechSynthesis.speak(u)}};
const sendMessage=(text)=>{if(!text.trim())return;const userMsg={role:'user',text:text.trim()};setMessages(prev=>[...prev,userMsg]);setInput('');
setTimeout(()=>{const reply=getAIResponse(text);setMessages(prev=>[...prev,{role:'ai',text:reply}]);speak(reply)},800);};
const toggleMic=()=>{
if(listening){if(recognitionRef.current)recognitionRef.current.stop();setListening(false);return}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){sendMessage('Voice input not supported in this browser');return}
const r=new SR();r.continuous=false;r.interimResults=false;r.lang='en-US';
r.onresult=(e)=>{const t=e.results[0][0].transcript;setInput(t);sendMessage(t)};
r.onend=()=>setListening(false);r.onerror=()=>setListening(false);
recognitionRef.current=r;r.start();setListening(true);
};
return(<div className="demo-container">
<a style={{color:'var(--text-muted)',textDecoration:'none',fontSize:'0.9rem',display:'inline-flex',alignItems:'center',gap:8,marginBottom:24,cursor:'pointer'}} onClick={e=>{e.preventDefault();nav('home')}}>← Back to Home</a>
<div style={{textAlign:'center',marginBottom:32}}>
<div style={{width:60,height:60,borderRadius:'50%',background:'var(--gradient-1)',margin:'0 auto 16px',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:speaking?'0 0 40px rgba(108,58,237,0.6)':'0 0 20px rgba(108,58,237,0.3)',transition:'box-shadow 0.3s',animation:speaking?'pulse-ring 1.5s ease-in-out infinite':'none'}}>
<span style={{fontSize:'1.5rem'}}>🤖</span></div>
<h2>Try Callix Voice Agent</h2>
<p style={{color:'var(--text-muted)',marginTop:8}}>Type a message or click the mic to speak</p></div>
<div className="chat-box" ref={chatRef}>
{messages.map((m,i)=><div key={i} className={"msg "+(m.role==='ai'?'msg-ai':'msg-user')}>{m.role==='ai'&&<span style={{marginRight:6}}>🤖</span>}{m.text}</div>)}
</div>
<div className="chat-input">
<input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')sendMessage(input)}} placeholder="Type your message..."/>
<button className="btn btn-primary" style={{padding:'12px 24px'}} onClick={()=>sendMessage(input)}>Send</button>
<button className={"mic-btn"+(listening?' active':'')} onClick={toggleMic}>{listening?'⏹':'🎙'}</button>
</div>
</div>);
}
