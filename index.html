<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Callix — AI Voice Agents for Sales, Support & Marketing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6C3AED;--primary-light:#8B5CF6;--primary-dark:#5B21B6;--accent:#06D6A0;--accent-dark:#05B587;--bg:#0A0A0F;--bg-card:#13131A;--bg-card-hover:#1A1A25;--text:#F8F8FC;--text-muted:#9CA3AF;--border:#2A2A3A;--gradient-1:linear-gradient(135deg,#6C3AED,#06D6A0);--gradient-2:linear-gradient(135deg,#6C3AED,#EC4899);--shadow-glow:0 0 60px rgba(108,58,237,0.15)}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.6}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--primary)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes pulse-ring{0%{transform:scale(0.8);opacity:1}100%{transform:scale(2.5);opacity:0}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes gradient-shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes orbit{from{transform:rotate(0deg) translateX(120px) rotate(0deg)}to{transform:rotate(360deg) translateX(120px) rotate(-360deg)}}
.fade-in{animation:fadeInUp 0.8s ease forwards;opacity:0}.delay-1{animation-delay:0.1s}.delay-2{animation-delay:0.2s}.delay-3{animation-delay:0.3s}.delay-4{animation-delay:0.4s}.delay-5{animation-delay:0.5s}
h1{font-size:clamp(2.5rem,6vw,4.5rem);font-weight:800;line-height:1.1;letter-spacing:-0.03em}
h2{font-size:clamp(2rem,4vw,3rem);font-weight:700;line-height:1.2;letter-spacing:-0.02em}
h3{font-size:1.25rem;font-weight:600}
.container{max-width:1200px;margin:0 auto;padding:0 24px}.section{padding:100px 0;position:relative}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:12px;font-weight:600;font-size:1rem;cursor:pointer;transition:all 0.3s ease;border:none;text-decoration:none;font-family:inherit}
.btn-primary{background:var(--gradient-1);color:white;box-shadow:0 4px 24px rgba(108,58,237,0.4)}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(108,58,237,0.6)}
.btn-secondary{background:transparent;color:var(--text);border:1.5px solid var(--border)}.btn-secondary:hover{border-color:var(--primary-light);background:rgba(108,58,237,0.1)}
.btn-accent{background:var(--accent);color:#0A0A0F}.btn-accent:hover{background:var(--accent-dark);transform:translateY(-2px)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;font-size:0.85rem;font-weight:500;background:rgba(108,58,237,0.15);color:var(--primary-light);border:1px solid rgba(108,58,237,0.3)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:32px;transition:all 0.3s ease}.card:hover{border-color:var(--primary);background:var(--bg-card-hover);transform:translateY(-4px)}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:16px 0;backdrop-filter:blur(20px);background:rgba(10,10,15,0.8);border-bottom:1px solid rgba(42,42,58,0.5)}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;background:var(--gradient-1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:32px;align-items:center}.nav-links a{color:var(--text-muted);text-decoration:none;font-size:0.95rem;font-weight:500;transition:color 0.2s}.nav-links a:hover{color:var(--text)}.nav-links .btn{padding:10px 24px;font-size:0.9rem}
.hero{padding-top:160px;padding-bottom:100px;text-align:center;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 0%,rgba(108,58,237,0.15) 0%,transparent 60%),radial-gradient(ellipse at 80% 50%,rgba(6,214,160,0.08) 0%,transparent 40%)}
.hero-content{position:relative;z-index:1}.hero h1{margin-bottom:24px}
.hero .gradient-text{background:var(--gradient-1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 200%;animation:gradient-shift 4s ease infinite}
.hero p{font-size:1.25rem;color:var(--text-muted);max-width:640px;margin:0 auto 40px}
.hero-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.hero-stats{display:flex;gap:48px;justify-content:center;margin-top:80px;padding-top:40px;border-top:1px solid var(--border)}
.hero-stat{text-align:center}.hero-stat .num{font-size:2.5rem;font-weight:800;background:var(--gradient-1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hero-stat .label{color:var(--text-muted);font-size:0.9rem;margin-top:4px}
.voice-orb-container{width:200px;height:200px;margin:0 auto 48px;position:relative;display:flex;align-items:center;justify-content:center}
.voice-orb{width:100px;height:100px;border-radius:50%;background:var(--gradient-1);box-shadow:0 0 60px rgba(108,58,237,0.4),0 0 120px rgba(108,58,237,0.2);animation:float 4s ease-in-out infinite;position:relative}
.voice-orb::after{content:'';position:absolute;inset:-20px;border-radius:50%;border:2px solid rgba(108,58,237,0.3);animation:pulse-ring 2s ease-out infinite}
.orbit-dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--accent);top:50%;left:50%;margin:-6px;animation:orbit 6s linear infinite}
.orbit-dot:nth-child(2){animation-delay:-2s;background:var(--primary-light)}.orbit-dot:nth-child(3){animation-delay:-4s;background:#EC4899}
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px}
.feature-card .icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:20px}
.feature-card h3{margin-bottom:12px}.feature-card p{color:var(--text-muted);font-size:0.95rem;line-height:1.7}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:32px;margin-top:60px}
.step{text-align:center;position:relative}
.step-num{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;margin:0 auto 20px;background:rgba(108,58,237,0.15);color:var(--primary-light);border:2px solid rgba(108,58,237,0.3)}
.step p{color:var(--text-muted);font-size:0.95rem}
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}.pricing-card{text-align:center}
.pricing-card.featured{border-color:var(--primary);background:linear-gradient(180deg,rgba(108,58,237,0.1) 0%,var(--bg-card) 100%);position:relative}
.pricing-card.featured::before{content:'Most Popular';position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--gradient-1);color:white;padding:4px 20px;border-radius:100px;font-size:0.8rem;font-weight:600}
.pricing-price{font-size:3rem;font-weight:800;margin:16px 0 8px}.pricing-price span{font-size:1rem;font-weight:400;color:var(--text-muted)}
.pricing-features{list-style:none;margin:24px 0;text-align:left}
.pricing-features li{padding:10px 0;color:var(--text-muted);font-size:0.95rem;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(42,42,58,0.5)}
.pricing-features li::before{content:'\2713';color:var(--accent);font-weight:700}
.cta-section{background:linear-gradient(135deg,rgba(108,58,237,0.15),rgba(6,214,160,0.1));border:1px solid rgba(108,58,237,0.2);border-radius:32px;padding:80px 40px;text-align:center;margin:0 24px}
.footer{padding:60px 0 30px;border-top:1px solid var(--border)}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px;margin-bottom:48px}
.footer-brand p{color:var(--text-muted);font-size:0.9rem;margin-top:12px;max-width:300px}
.footer-col h4{font-size:0.85rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:16px}
.footer-col a{display:block;color:var(--text-muted);text-decoration:none;font-size:0.9rem;padding:4px 0;transition:color 0.2s}.footer-col a:hover{color:var(--text)}
.footer-bottom{text-align:center;padding-top:24px;border-top:1px solid var(--border);color:var(--text-muted);font-size:0.85rem}
.demo-page{min-height:100vh;padding-top:100px}.demo-container{max-width:800px;margin:0 auto;padding:0 24px}
.demo-chat{background:var(--bg-card);border:1px solid var(--border);border-radius:24px;overflow:hidden;min-height:500px;display:flex;flex-direction:column}
.demo-chat-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px}
.demo-chat-header .avatar{width:44px;height:44px;border-radius:50%;background:var(--gradient-1);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.demo-chat-header .info h3{font-size:1rem}.demo-chat-header .info p{font-size:0.8rem;color:var(--accent)}
.demo-messages{flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;max-height:400px}
.msg{max-width:80%;padding:14px 18px;border-radius:18px;font-size:0.95rem;line-height:1.6;animation:fadeInUp 0.3s ease}
.msg.bot{background:rgba(108,58,237,0.15);border:1px solid rgba(108,58,237,0.2);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:rgba(6,214,160,0.15);border:1px solid rgba(6,214,160,0.2);align-self:flex-end;border-bottom-right-radius:4px}
.demo-controls{padding:20px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px}
.demo-input{flex:1;padding:14px 18px;border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);font-size:0.95rem;font-family:inherit;outline:none;transition:border-color 0.2s}
.demo-input:focus{border-color:var(--primary)}.demo-input::placeholder{color:var(--text-muted)}
.mic-btn{width:52px;height:52px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.3rem;transition:all 0.3s;background:var(--bg-card);color:var(--text)}
.mic-btn:hover{border-color:var(--primary)}.mic-btn.listening{background:var(--primary);border-color:var(--primary);box-shadow:0 0 30px rgba(108,58,237,0.5);animation:pulse-ring 1.5s ease-out infinite}
.send-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:var(--gradient-1);color:white;transition:all 0.3s}.send-btn:hover{transform:scale(1.05)}
.wave-bars{display:flex;align-items:center;gap:3px;height:40px;justify-content:center;margin:20px 0}.wave-bar{width:4px;border-radius:4px;background:var(--primary-light);transition:height 0.1s}
.dashboard{display:flex;min-height:100vh;padding-top:72px}
.sidebar{width:260px;background:var(--bg-card);border-right:1px solid var(--border);padding:24px 16px;position:fixed;top:72px;bottom:0}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;cursor:pointer;color:var(--text-muted);font-size:0.95rem;transition:all 0.2s;margin-bottom:4px}
.sidebar-item:hover,.sidebar-item.active{background:rgba(108,58,237,0.15);color:var(--text)}.sidebar-item.active{border-left:3px solid var(--primary)}
.dash-main{flex:1;margin-left:260px;padding:32px}.dash-header{margin-bottom:32px}.dash-header h2{font-size:1.75rem}.dash-header p{color:var(--text-muted);margin-top:4px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:32px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:24px}
.stat-card .label{font-size:0.85rem;color:var(--text-muted);margin-bottom:8px}.stat-card .value{font-size:2rem;font-weight:700}.stat-card .change{font-size:0.85rem;color:var(--accent);margin-top:4px}
.bot-builder{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:32px}
.form-group{margin-bottom:24px}.form-label{display:block;font-size:0.9rem;font-weight:500;margin-bottom:8px;color:var(--text-muted)}
.form-input{width:100%;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);font-size:0.95rem;font-family:inherit;outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--primary)}textarea.form-input{min-height:120px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}select.form-input{appearance:none;cursor:pointer}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.toggle{width:48px;height:26px;border-radius:13px;background:var(--border);cursor:pointer;position:relative;transition:background 0.3s;border:none}.toggle.on{background:var(--primary)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:white;top:3px;left:3px;transition:transform 0.3s}.toggle.on::after{transform:translateX(22px)}
.integrations-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:20px}
.integration-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;cursor:pointer;transition:all 0.3s}
.integration-card:hover{border-color:var(--primary)}.integration-card .icon{font-size:2rem;margin-bottom:8px}.integration-card .name{font-size:0.85rem;color:var(--text-muted)}
.integration-card.connected{border-color:var(--accent)}.integration-card.connected .status{color:var(--accent);font-size:0.75rem;margin-top:4px}
.section-header{text-align:center;margin-bottom:60px}.section-header .badge{margin-bottom:16px}.section-header p{color:var(--text-muted);max-width:600px;margin:16px auto 0;font-size:1.1rem}
@media(max-width:768px){.nav-links{display:none}.hero-stats{flex-direction:column;gap:24px}.hero-buttons{flex-direction:column;align-items:center}.features-grid{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr;gap:24px}.dashboard{flex-direction:column}.sidebar{display:none}.dash-main{margin-left:0}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef}=React;
const convFlows={greeting:["Hey there! I'm Aria, your AI sales assistant powered by Callix. How can I help you today?"],pricing:["Great question! Callix offers three plans: Starter at $49/month, Growth at $149/month (most popular), and Enterprise with custom pricing. The Growth plan includes unlimited voice agents, CRM integrations, and analytics. Want me to help you figure out which plan fits best?"],features:["Callix gives you AI voice agents that sound completely natural. They can handle inbound calls, make outbound sales calls, qualify leads, book meetings, and integrate with your CRM. The cool part? They learn from every conversation and get smarter over time."],demo:["I'd love to set up a personalized demo! You're actually experiencing a mini version of Callix right now by talking to me. For a full demo with your team, I can connect you with our solutions team. Would you like to schedule that?"],howItWorks:["It's super simple: Create your voice agent in our dashboard, connect your tools with one-click integrations, then embed on your website with a single line of code. You can be up and running in under 10 minutes!"],comparison:["Unlike traditional call centers or basic chatbots, Callix agents actually speak with natural voice. They understand context, handle objections, and have genuine conversations. Think of it as having your best sales rep available 24/7."],support:["I'm here to help! For technical support, reach our team at support@callix.ai or through the dashboard. We have 24/7 live chat for Growth and Enterprise customers."],default:["That's a great question! I can help with pricing info, feature details, scheduling a demo, or explaining how Callix works. What would you like to know more about?"]};
function getAIResponse(msg){const m=msg.toLowerCase();if(m.match(/pric|cost|plan|how much/))return convFlows.pricing[0];if(m.match(/feature|what can|capabilit/))return convFlows.features[0];if(m.match(/demo|try|test|show/))return convFlows.demo[0];if(m.match(/how.*work|setup|start/))return convFlows.howItWorks[0];if(m.match(/compare|different|vs|better/))return convFlows.comparison[0];if(m.match(/help|support|issue/))return convFlows.support[0];if(m.match(/hi|hello|hey/))return convFlows.greeting[0];return convFlows.default[0]}
function Nav({page,setPage}){return(<nav className="nav"><div className="container nav-inner"><a href="#" onClick={e=>{e.preventDefault();setPage('home')}} className="nav-logo">⚡ Callix</a><div className="nav-links"><a href="#" onClick={e=>{e.preventDefault();setPage('home');setTimeout(()=>document.getElementById('features')?.scrollIntoView({behavior:'smooth'}),100)}}>Features</a><a href="#" onClick={e=>{e.preventDefault();setPage('home');setTimeout(()=>document.getElementById('pricing')?.scrollIntoView({behavior:'smooth'}),100)}}>Pricing</a><a href="#" onClick={e=>{e.preventDefault();setPage('demo')}}>Try Demo</a><a href="#" onClick={e=>{e.preventDefault();setPage('dashboard')}}>Dashboard</a><button className="btn btn-primary" onClick={()=>setPage('demo')}>Get Started Free →</button></div></div></nav>)}
function Hero({setPage}){return(<section className="hero section"><div className="hero-bg"></div><div className="container hero-content"><div className="voice-orb-container fade-in"><div className="voice-orb"></div><div className="orbit-dot"></div><div className="orbit-dot"></div><div className="orbit-dot"></div></div><div className="badge fade-in delay-1">🚀 AI Voice Agents for Every Business</div><h1 className="fade-in delay-2">Your AI Sales Team<br/>That <span className="gradient-text">Never Sleeps</span></h1><p className="fade-in delay-3">Deploy human-sounding AI voice agents that qualify leads, book meetings, and close deals — 24/7 on your website and phone lines. Set up in 10 minutes, no code required.</p><div className="hero-buttons fade-in delay-4"><button className="btn btn-primary" onClick={()=>setPage('demo')}>🎙️ Try Live Demo</button><button className="btn btn-secondary" onClick={()=>setPage('dashboard')}>View Dashboard →</button></div><div className="hero-stats fade-in delay-5"><div className="hero-stat"><div className="num">10M+</div><div className="label">Conversations Handled</div></div><div className="hero-stat"><div className="num">3.2x</div><div className="label">More Leads Converted</div></div><div className="hero-stat"><div className="num">50+</div><div className="label">Integrations</div></div><div className="hero-stat"><div className="num">24/7</div><div className="label">Always Available</div></div></div></div></section>)}
function Features(){const f=[{icon:"🎯",bg:"rgba(108,58,237,0.15)",title:"Smart Lead Qualification",desc:"AI agents ask the right questions, score leads in real-time, and route hot prospects directly to your sales team."},{icon:"🗣️",bg:"rgba(6,214,160,0.15)",title:"Human-Like Voice",desc:"Powered by advanced speech synthesis, our voice agents sound natural and engaging. They handle interruptions and understand context."},{icon:"🔗",bg:"rgba(236,72,153,0.15)",title:"CRM Integrations",desc:"One-click integrations with Salesforce, HubSpot, Pipedrive, and 50+ tools. Every conversation is automatically logged."},{icon:"📊",bg:"rgba(251,191,36,0.15)",title:"Real-Time Analytics",desc:"Track conversion rates, call duration, sentiment analysis, and agent performance in a beautiful dashboard."},{icon:"🌍",bg:"rgba(59,130,246,0.15)",title:"Multilingual Support",desc:"Deploy voice agents in 30+ languages. Automatically detect caller language and switch seamlessly."},{icon:"⚡",bg:"rgba(168,85,247,0.15)",title:"Instant Setup",desc:"Go live in under 10 minutes. No code, no complex configurations. Just describe your ideal agent and start converting."}];return(<section className="section" id="features"><div className="container"><div className="section-header"><div className="badge">✨ Features</div><h2>Everything You Need to Scale Conversations</h2><p>Callix replaces expensive call centers with intelligent AI agents that work around the clock.</p></div><div className="features-grid">{f.map((x,i)=>(<div className={"card feature-card fade-in delay-"+(i%3+1)} key={i}><div className="icon" style={{background:x.bg}}>{x.icon}</div><h3>{x.title}</h3><p>{x.desc}</p></div>))}</div></div></section>)}

function DemoPage(){const[messages,setMessages]=useState([{role:'bot',text:convFlows.greeting[0]}]);const[input,setInput]=useState('');const[isListening,setIsListening]=useState(false);const[isSpeaking,setIsSpeaking]=useState(false);const[waveBars,setWaveBars]=useState(Array(20).fill(8));const messagesEnd=useRef(null);const recognitionRef=useRef(null);const synthRef=useRef(window.speechSynthesis);const waveInterval=useRef(null);useEffect(()=>{messagesEnd.current?.scrollIntoView({behavior:'smooth'})},[messages]);useEffect(()=>{setTimeout(()=>speak(convFlows.greeting[0]),800)},[]);function speak(text){if(!synthRef.current)return;synthRef.current.cancel();const u=new SpeechSynthesisUtterance(text);const voices=synthRef.current.getVoices();const fv=voices.find(v=>v.name.includes('Samantha')||v.name.includes('Female')||v.lang==='en-US');if(fv)u.voice=fv;u.rate=1.0;u.pitch=1.1;u.onstart=()=>{setIsSpeaking(true);waveInterval.current=setInterval(()=>{setWaveBars(Array(20).fill(0).map(()=>Math.random()*28+4))},100)};u.onend=()=>{setIsSpeaking(false);clearInterval(waveInterval.current);setWaveBars(Array(20).fill(8))};synthRef.current.speak(u)}function handleSend(text){const userMsg=text||input;if(!userMsg.trim())return;setInput('');setMessages(prev=>[...prev,{role:'user',text:userMsg}]);setTimeout(()=>{const response=getAIResponse(userMsg);setMessages(prev=>[...prev,{role:'bot',text:response}]);speak(response)},800+Math.random()*600)}function toggleListening(){if(isListening){recognitionRef.current?.stop();setIsListening(false);return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Speech recognition not supported. Please use Chrome.');return}const r=new SR();r.continuous=false;r.interimResults=false;r.lang='en-US';r.onresult=e=>{setIsListening(false);handleSend(e.results[0][0].transcript)};r.onerror=()=>setIsListening(false);r.onend=()=>setIsListening(false);recognitionRef.current=r;r.start();setIsListening(true)}return(<div className="demo-p
